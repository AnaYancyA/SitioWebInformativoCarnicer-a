<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los 3 Cochinitos - Contacto</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="../styles/encabezado.css">
    <link rel="stylesheet" href="../styles/carruselcontacto.css">
    <link rel="stylesheet" href="../styles/piepagina.css">
    <link rel="stylesheet" href="../styles/formulariocontacto.css">
</head>

<body>

    <!-- Navbar modular -->
    <div id="navbar-placeholder"></div>

    <!-- Contenedor para el carrusel de servicios -->
    <section class="container my-3">
        <div id="carruselcontacto-placeholder"></div>
    </section>

    <!-- Contenedor para formulario contacto -->
    <section class="container my-3">
        <div id="formulariocontacto-placeholder"></div>
        <div id="estadoFormulario" class="mt-3"></div>
    </section>



    <!-- Pie de página -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Cargar componentes con rutas relativas -->
    <script>
        async function cargarComponentes() {
            try {
                // Navbar
                const navResp = await fetch('../utility/encabezado.html');
                const navHtml = await navResp.text();
                document.getElementById('navbar-placeholder').innerHTML = navHtml;

                // Carrusel de contacto
                const carResp = await fetch('../utility/carruselcontacto.html');
                const carHtml = await carResp.text();
                document.getElementById('carruselcontacto-placeholder').innerHTML = carHtml;


                // Formulario de contacto
                const formResp = await fetch('../utility/formulariocontacto.html');
                const formHtml = await formResp.text();
                document.getElementById('formulariocontacto-placeholder').innerHTML = formHtml;



                // Pie de página
                const footerResp = await fetch('../utility/piepaginanosotros.html');
                const footerHtml = await footerResp.text();
                document.getElementById('footer-placeholder').innerHTML = footerHtml;

            } catch (err) {
                console.error('Error cargando los componentes:', err);
            }
        }

        cargarComponentes();


    </script>



</body>

</html>
