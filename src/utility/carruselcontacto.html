<div id="carouselcontacto" class="carousel slide" data-bs-ride="carousel">

  <!-- Indicadores -->
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#carouselcontacto" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Oficina"></button>
    <button type="button" data-bs-target="#carouselcontacto" data-bs-slide-to="1" aria-label="Ubicación"></button>
    <button type="button" data-bs-target="#carouselcontacto" data-bs-slide-to="2" aria-label="Horario"></button>
  </div>

  <!-- Slides -->
  <div class="carousel-inner">

    <!-- Slide 1: Oficina -->
    <div class="carousel-item active">
      <img src="../assets/dir1.webp" class="d-block w-100" alt="Nuestra Oficina">
      <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 p-3 rounded">
        <h5>Nuestra Oficina</h5>
        <p>Visítanos en nuestra oficina principal, estamos listos para atenderte.</p>
      </div>
    </div>

    <!-- Slide 2: Dirección en Waze -->
    <div class="carousel-item">
      <img src="../assets/dir.png" class="d-block w-100" alt="Ubicación en Waze">
      <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 p-3 rounded">
        <h5>Encuéntranos en Waze</h5>
        <p>
          <a href="https://waze.com/ul?ll=9.9381,-84.0917&navigate=yes" target="_blank" class="btn">Abrir en Waze</a>
        </p>
      </div>
    </div>

    <!-- Slide 3: Horario de atención -->
    <div class="carousel-item">
      <img src="../assets/horario.jpg" class="d-block w-100" alt="Horario de atención">
      <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 p-3 rounded">
        <h5>Horario de Atención</h5>
        <p>Lunes a Viernes: 8:00 a.m. - 5:00 p.m.<br>Sábados: 8:00 a.m. - 12:00 m.</p>
      </div>
    </div>

  </div>

  <!-- Controles -->
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselcontacto" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Anterior</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselcontacto" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Siguiente</span>
  </button>

</div>
